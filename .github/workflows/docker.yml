name: Docker (Container Build Verification)

# Triggers: Runs when files related to Docker, services, or infra are modified
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "**/Dockerfile*"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "**/Dockerfile*"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  build-containers:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (Modern Docker builder with fast layer caching)
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Test building the API Container
      - name: 🔨 Build API Docker Image
        run: |
          docker build -t evoc-api:test -f services/api/Dockerfile .

      # Step 4: Test building the Background Worker Container
      - name: 🔨 Build Worker Docker Image
        run: |
          docker build -t evoc-worker:test -f services/worker/Dockerfile .
